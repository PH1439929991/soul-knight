<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf6e4">
<title>纸片幸存者 · Paper Survivors</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #2b241d; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; }
  #rotate {
    position: fixed; left: 50%; top: 10px; transform: translateX(-50%);
    color: #f2c14e; font: 12px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
    background: rgba(0,0,0,.55); border: 1px solid rgba(242,193,78,.35);
    padding: 4px 10px; border-radius: 999px; pointer-events: none;
    display: none; white-space: nowrap;
  }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: block; } }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate">建议横屏游玩</div>
  <script src="game.js"></script>
</body>
</html>
