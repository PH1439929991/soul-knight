<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf6e4">
<title>纸片幸存者 · Paper Survivors</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%; min-height: 100dvh;
    background: #2b241d; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; image-rendering: pixelated; }
  #rotate {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; padding: 24px;
    color: #3a3026; background: rgba(43,36,29,.88);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
  }
  #rotate-card {
    width: min(320px, calc(100vw - 48px)); padding: 24px 22px;
    text-align: center; background: #fff9e9; border: 3px solid #3a3026; border-radius: 10px;
    box-shadow: 7px 8px 0 rgba(0,0,0,.2);
  }
  #rotate-icon { display: block; font-size: 42px; line-height: 1; margin-bottom: 12px; }
  #rotate strong { display: block; font-size: 20px; margin-bottom: 7px; }
  #rotate p { margin: 0 0 16px; color: #6e6254; font-size: 14px; line-height: 1.55; }
  #rotate-action {
    min-height: 46px; padding: 9px 18px; color: #3a3026; background: #f5c542;
    border: 2px solid #3a3026; border-radius: 6px; font-weight: 800; font-size: 15px;
  }
  #fullscreen-btn {
    position: fixed; z-index: 12;
    right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
    display: none; width: 44px; height: 44px; padding: 0;
    color: #3a3026; background: rgba(255,249,233,.88); border: 2px solid #3a3026; border-radius: 9px;
    font: 700 22px/40px sans-serif; touch-action: manipulation;
  }
  #name-editor[hidden] { display: none; }
  #name-editor {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(43,36,29,.56); touch-action: auto;
  }
  #name-card {
    width: min(320px, calc(100vw - 48px));
    padding: 20px 22px 18px;
    color: #3a3026; background: #fff9e9;
    border: 3px solid #3a3026; border-radius: 7px;
    box-shadow: 7px 8px 0 rgba(58,48,38,.2);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #name-card label { display: block; font-weight: 700; font-size: 18px; margin-bottom: 10px; }
  #nickname-input {
    box-sizing: border-box; width: 100%; padding: 9px 11px;
    color: #3a3026; background: #fffdf8;
    border: 2px solid #8a7a66; border-radius: 4px;
    font: 16px/1.3 "PingFang SC", "Microsoft YaHei", sans-serif;
    outline: none;
  }
  #nickname-input:focus { border-color: #c98a1e; }
  #name-actions { display: flex; gap: 10px; margin-top: 14px; }
  #name-actions button {
    flex: 1; padding: 8px; border: 2px solid #3a3026; border-radius: 4px;
    color: #3a3026; background: #fffdf8; font-weight: 700; cursor: pointer;
  }
  #name-actions button[type="submit"] { background: #f5c542; }
  @media (pointer: coarse) { #fullscreen-btn { display: block; } }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <button type="button" id="fullscreen-btn" aria-label="进入全屏">⛶</button>
  <div id="name-editor" hidden>
    <form id="name-card">
      <label for="nickname-input">设置角色昵称</label>
      <input id="nickname-input" maxlength="12" autocomplete="off" enterkeyhint="done">
      <div id="name-actions">
        <button type="button" id="name-cancel">取消</button>
        <button type="submit">保存昵称</button>
      </div>
    </form>
  </div>
  <script src="game.js"></script>
</body>
</html>
